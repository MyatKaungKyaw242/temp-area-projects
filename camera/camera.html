<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="camera.css">
</head>

<body>
    <div class="left-side">
        <div class="top-text">
            <h2>Bento Grid <br> Template</h2>

            <div class="color-bar">
                <div class="segment black"></div>
                <div class="segment gray"></div>
                <div class="segment yellow"></div>
                <div class="segment lightblue"></div>
            </div>
        </div>

        <div class="circle-text">

            <div class="circle"></div>

            <div class="text-span">
                <span>Design</span>
                By Muskan Verma
            </div>
        </div>

    </div>

    <div class="right-side">

        <div class="boxes box-1">
            <img src="#" alt="">

            <div class="box-1-texts">
                <h2>who <br> are <br> we?</h2>

                <p>We're yound & wild <br> explorers ---- <br> cut on a summary <br> to turn on your true vibe</p>
            </div>
        </div>

        <div class="boxes box-2">
            <img src="#" alt="">

            <div class="box-2-text">
                <span>2.1 Channel Soundbar <br>with Wireless Subwoofer</span>

            </div>
        </div>

        <div class="boxes box-3">
            <img src="#" alt="">


            <div class="box-3-texts">
                <h4>Rocket 650 RR34</h4>

                <div class="button-box-3">
                    <button>Check Detail</button>
                </div>
            </div>
        </div>

        <div class="boxes box-4">
            <div class="box-4-text-one">
                <span>Dual EQ Modes</span>
                <span class="tag">Movies</span>
                <span class="tag active">Music</span>
            </div>

            <img src="#" alt="">

            <div class="box-4-text-two">
                <span>Bluetooth</span>
                <span class="tag">V5.3</span>
            </div>
        </div>

        <div class="boxes box-5">
            <img src="boat-bg.jpg" alt="boat background">
            <div class="box-5-text">
                <h1>bo<span>A</span>t</h1>
                <p>...plug into nirvana</p>
            </div>
        </div>

        <div class="boxes box-6">
            <img src="#" alt="">
        </div>

        <div class="boxes box-7">
            <img src="#" alt="">
        </div>

        <div class="boxes box-8">
            <img src="#" alt="">

            <div box-8-text>
                <span class="box-8-qw">Best Smartwatches</span>
                <span class="box-8-wq">Under 3K</span>
            </div>
        </div>






    </div>

</body>

</html>
